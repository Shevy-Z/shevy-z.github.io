<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>INFINITI 取送车券管理</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="portal-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main class="portal-shell">
      <div class="brand-mark brand-mark--large" aria-label="Infiniti">
        <span class="brand-emblem" aria-hidden="true"><i></i></span>
        <strong>INFINITI</strong>
      </div>
      <p class="eyebrow">VALET VOUCHER SYSTEM</p>
      <h1>取送车券管理平台</h1>
      <p class="portal-intro">为经销商提供发券、查券与配额管理的一体化原型。</p>
      <section class="portal-grid" aria-label="选择入口">
        <a class="portal-card" href="./dealer/">
          <span class="portal-card__index">01</span>
          <div>
            <span class="portal-card__label">经销商 H5</span>
            <h2>发券与查券</h2>
            <p>登录后查询 VIN 发券记录，或一次发放 2 张取送车券。</p>
          </div>
          <span class="portal-card__enter">进入系统</span>
        </a>
        <a class="portal-card portal-card--light" href="./admin/">
          <span class="portal-card__index">02</span>
          <div>
            <span class="portal-card__label">管理后台</span>
            <h2>经销商管理</h2>
            <p>筛选经销商、配置发券数量，并复制经销商账号密码。</p>
          </div>
          <span class="portal-card__enter">进入系统</span>
        </a>
      </section>
      <p class="portal-footnote">交互原型 · 数据仅保存在当前浏览器</p>
    </main>
    <script src="./assets/app.js"></script>
  </body>
</html>
